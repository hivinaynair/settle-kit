    statement: "Finalized Solana discovery requires complete pagination, decoded successful instructions, canonical transaction order and archival coverage; partial/pruned/version-unsupported history stays incomplete."
    sources:
      - {"ref":"docs/decisions.md","locator":"| D232 |","sha256":"5ef9b3f369fd467fe64bb3306a462813e219e94c8d89ff3b59ebd19d2d205c8c"}
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J13.S3","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/tasks/M2.T8.md","locator":"Build complete finalized","sha256":"a8b0a6bb49a7e4d4c5471b820fd993b97c8f7b9ee170bed84a08fcd0003e10c7"}
  - id: O24
    statement: "Manual Solana retries bind the expected persistent drain sequence; a delayed old command cannot be retargeted to later funds, and external drains remain separate settlements."
    sources:
      - {"ref":"docs/decisions.md","locator":"| D233 |","sha256":"5ef9b3f369fd467fe64bb3306a462813e219e94c8d89ff3b59ebd19d2d205c8c"}
      - {"ref":"docs/decisions.md","locator":"| D234 |","sha256":"5ef9b3f369fd467fe64bb3306a462813e219e94c8d89ff3b59ebd19d2d205c8c"}
      - {"ref":"docs/tasks/M2.T9.md","locator":"Recover expired host-only","sha256":"288ac510690bac681716537a076168cb68fc546b24f524d55f01125fc650ddfe"}
      - {"ref":"docs/plans/2026-10-15-deposit-sdk-technical-design.md","locator":"Never\nretarget the old command","sha256":"5841803f601d174f5e4d0fec0f380f1096d848e73ac83555027d125e1839461c"}
  - id: O25
    statement: "Solana consent is an exact transaction message requiring payer and host co-signatures after durable acceptance. It has a permanent program payment receipt and isolated wallet vault, with no signAndSend/delegate shortcut."
    sources:
      - {"ref":"docs/decisions.md","locator":"| D137 |","sha256":"5ef9b3f369fd467fe64bb3306a462813e219e94c8d89ff3b59ebd19d2d205c8c"}
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J14.S3","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J14.S4","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/tasks/M2.T10.md","locator":"Accept durably","sha256":"703b5e062c4589d9f42503cb3a3f6e8e4cbaf0b765e71a2b3a816d536373e796"}
  - id: O26
    statement: "No-debit proof requires expired original blockhash at finalized height plus complete execution history and receipt checks; an RPC null or wall-clock timeout cannot authorize another payment."
    sources:
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J14.S10","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/tasks/M2.T10.md","locator":"Prove expiry","sha256":"703b5e062c4589d9f42503cb3a3f6e8e4cbaf0b765e71a2b3a816d536373e796"}
  - id: O27
    statement: "Solana source-message verification must bind the protected tag from actual program/CCTP execution to canonical Base consumption; shared forwarding polling never authorizes reburn or credit."
    sources:
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J13.S5","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J14.S5","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/tasks/M2.T11.md","locator":"Decode and match","sha256":"f5c481423011c235c44b37c61f7ec4e1fcda121c53f0113500ff5f3db6843f07"}
  - id: O28
    statement: "Manual net and quoted fixed-credit allocation share the existing Base-safe atomic credit/outbox and host acknowledgment rules with source-family-qualified identity."
    sources:
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J13.S5a","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J14.S6","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/tasks/M2.T6.md","locator":"Own J13.S5a","sha256":"ee8458974cfa576a06a4dfa44e8340d5f59033dfaf5c9cd240694e0edae3b9b1"}
      - {"ref":"docs/tasks/M2.T7.md","locator":"Solana-origin","sha256":"fa056e30ab0cce5dc137083239e274e6238529b9aecb3a337cb412bced03cf79"}
  - id: O29
    statement: "Solana over-limit/refund and supported asset recovery preserve rent/replay state and distinguish recovery from repayment; D129 closure uses finalized Solana or safe EVM evidence with explicit host-reported labels."
    sources:
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J15.S2","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/journeys/settle-kit.yaml","locator":"id: J15.S4","sha256":"a93d2052656738283c09ebcfb936abc562b52cfe971c11bb377a0f3e303d1ef3"}
      - {"ref":"docs/tasks/M3.T4.md","locator":"Close only an evidenced","sha256":"ed7322bc1907a6ce4eb0674ed119dd7414cfdab0cd0dca55900ee053424a8e31"}
  - id: O30
    statement: "D58 and M4.T1 require actual devnet/manual/zero-payer-SOL wallet/Base-host-credit and recovery evidence. The cited primary protocol sources describe capabilities; they are not Settle Kit route proof."
    sources:
      - {"ref":"docs/decisions.md","locator":"| D58 |","sha256":"5ef9b3f369fd467fe64bb3306a462813e219e94c8d89ff3b59ebd19d2d205c8c"}
      - {"ref":"docs/tasks/M2.T11.md","locator":"Record both real","sha256":"f5c481423011c235c44b37c61f7ec4e1fcda121c53f0113500ff5f3db6843f07"}
