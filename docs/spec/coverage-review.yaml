observations:
  - id: O1
    statement: The spec overview reports agreed scope complete and product implementation not started. This is a document observation, not runtime proof.
    sources:
      - {ref: docs/spec/README.md, locator: 'Product implementation has not started.'}
  - id: O2
    statement: Core, server and React entry points contain only empty exports at the reviewed revision.
    sources:
      - {ref: packages/core/src/index.ts, locator: 'export {};'}
      - {ref: packages/server/src/index.ts, locator: 'export {};'}
      - {ref: packages/react/src/index.ts, locator: 'export {};'}
  - id: O3
    statement: S15 lists combined-route, upgrade-recovery and consumer-onboarding proofs as not run. S16 reports one successful MetaMask testnet session. Those historical results were read, not rerun here.
    sources:
      - {ref: docs/spikes.md, locator: '### Implementation acceptance checks (D57)'}
      - {ref: docs/spikes.md, locator: '**Live MetaMask payment passed on Base Sepolia.**'}
  - id: O4
    statement: Review deduction - non-USDC/native-ETH rescue is accepted in D33 and constrained by I11, but J7 maps over-limit USDC recovery and rejects rescue(USDC), without a positive rescue path.
    sources:
      - {ref: docs/decisions.md, locator: '| D33 |'}
      - {ref: docs/journeys/settle-kit.yaml, locator: 'id: I11'}
      - {ref: docs/journeys/settle-kit.yaml, locator: 'id: J7.S2'}
  - id: O5
    statement: Review deduction - J7.S3.c3 keeps repayment alerts open until the host records resolution, but no journey step specifies the recording, authorization and alert-closure outcome as an end-to-end procedure.
    sources:
      - {ref: docs/decisions.md, locator: '| D51 |'}
      - {ref: docs/decisions.md, locator: '| D54 |'}
      - {ref: docs/journeys/settle-kit.yaml, locator: 'retain the alert until the host records repayment'}
  - id: O6
    statement: Review deduction - D43 promises address-poisoning protection. Existing criteria cover account ownership, fixed destinations, test watermark and accessible controls, but do not specify the address-poisoning interaction and its acceptance outcome.
    sources:
      - {ref: docs/decisions.md, locator: '| D43 |'}
      - {ref: docs/journeys/settle-kit.yaml, locator: 'id: J2.S1'}
      - {ref: docs/journeys/settle-kit.yaml, locator: 'id: J9.S2'}
  - id: O7
    statement: Native and reusable formats differ. The native decision table has no Status column; journeys use bucket, uses, string next targets and exit objects. Direct portable validation is unsupported without an explicit adapter or migration.
    sources:
      - {ref: docs/decisions.md, locator: '| ID | Decision | Why | Rejected | Date | Supersedes |'}
      - {ref: docs/journeys/settle-kit.yaml, locator: 'uses: J4'}
