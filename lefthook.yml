pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: bunx biome check --write --staged --no-errors-on-unmatched --files-ignore-unknown=true
      stage_fixed: true

    check-tokens:
      glob: "{apps,packages/ui}/**/*.{ts,tsx,css}"
      run: bun run check-tokens

    journeys:
      glob: "{docs/journeys/*.yaml,docs/decisions.md}"
      run: bun run journeys:render && git add docs/journeys/*.md 2>/dev/null; bun run check-journeys

    check-types:
      glob: "*.{ts,tsx}"
      run: TURBO_UI=0 bunx turbo run check-types --filter='...[HEAD]'
